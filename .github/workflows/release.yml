name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto derives it from conventional commits)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Bump version and tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      changed: ${{ steps.bump.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute next version
        id: bump
        run: bash scripts/release-version.sh --bump "${{ github.event.inputs.bump || 'auto' }}" | tee -a "$GITHUB_OUTPUT"
      - name: Commit, tag and push
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${{ steps.bump.outputs.tag }}"
          fi
          git tag -a "${{ steps.bump.outputs.tag }}" -m "${{ steps.bump.outputs.tag }}"
          git push origin HEAD:main "refs/tags/${{ steps.bump.outputs.tag }}"

  build:
    name: Build (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev pkg-config
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-
      - name: Test
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked

      - name: Cache cargo-deb
        if: runner.os == 'Linux'
        id: cargo-deb-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deb
          key: ${{ runner.os }}-cargo-deb-3
      - name: Install cargo-deb
        if: runner.os == 'Linux' && steps.cargo-deb-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deb --version '^3' --locked
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          cargo deb --no-build --output "out/simple-converter-$VERSION-linux-x86_64.deb"
          bash packaging/appimage.sh
          ls -la out

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/simple-converter.exe "out/simple-converter-$env:VERSION-windows-x86_64-portable.exe"
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" packaging\installer.iss
          Get-ChildItem out

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: |
          cd out
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --latest \
            --title "${{ needs.version.outputs.tag }}" \
            --generate-notes \
            out/*
